<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YouTool Beta | Amministrazione</title>
<style>
:root{font-family:Arial,sans-serif;color:#1f2937;background:#f4f6f8}*{box-sizing:border-box}body{margin:0}header{background:#111827;color:white;padding:24px max(20px,calc((100vw - 1100px)/2))}header h1{margin:0;font-size:28px}header p{color:#cbd5e1;margin:8px 0 0}main{max-width:1100px;margin:32px auto;padding:0 20px}.panel,.item{background:#fff;padding:22px;border-radius:12px;box-shadow:0 2px 8px #0001;margin-bottom:18px}h2{margin-top:0}input{display:block;width:100%;padding:12px;margin:8px 0 16px;border:1px solid #cbd5e1;border-radius:7px;font-size:16px}label{font-weight:bold}button{cursor:pointer;border:0;border-radius:7px;padding:11px 16px;font-weight:bold;font-size:14px}button:disabled{opacity:.55;cursor:wait}.primary{background:#2563eb;color:#fff}.approve{background:#166534;color:#fff}.reject{background:#b91c1c;color:#fff}.neutral{background:#e5e7eb;color:#111827}.buttons{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.brand{color:#2563eb;font-weight:bold;font-size:13px}.meta{color:#6b7280;font-size:13px}.summary{white-space:pre-line;line-height:1.55}.item h3{margin:9px 0}.item a{color:#2563eb}.status{display:inline-block;background:#e5e7eb;border-radius:5px;padding:4px 8px;font-size:12px;font-weight:bold}.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.message{color:#475569;margin:14px 0}.error{color:#b91c1c}.success{color:#166534}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.tabs button[aria-pressed="true"]{background:#111827;color:white}.hidden{display:none!important}#login{max-width:480px}#login button{width:100%}
</style>
</head>
<body>
<header><h1>YouTool — Amministrazione</h1><p>Gestione privata delle notizie</p></header>
<main>
<section id="login" class="panel">
<h2>Accesso amministratore</h2>
<form id="login-form">
<label for="email">Email</label><input id="email" type="email" autocomplete="username" required>
<label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required>
<button class="primary" id="login-button" type="submit">Accedi</button>
</form><p id="login-message" class="message" role="status"></p>
</section>
<section id="dashboard" class="hidden">
<div class="panel topbar"><div><h2>Pannello editoriale</h2><p id="user-label" class="meta"></p></div><button class="neutral" id="logout-button">Esci</button></div>
<div class="tabs" aria-label="Filtra notizie">
<button class="neutral" data-filter="pending" aria-pressed="true">Da valutare</button>
<button class="neutral" data-filter="approved" aria-pressed="false">Approvate</button>
<button class="neutral" data-filter="rejected" aria-pressed="false">Rifiutate</button>
<button class="neutral" data-filter="all" aria-pressed="false">Tutte</button>
<button class="primary" id="refresh-button">Aggiorna</button>
</div>
<p id="dashboard-message" class="message" role="status"></p><div id="items"></div>
</section>
</main>
<script>
'use strict';
const SUPABASE_URL = 'https://odzjflkivahuqrqihytm.supabase.co';
const PUBLIC_KEY = 'sb_publishable_nHVHlfC6LBQ7U7xaK2-a1A_gD2qYltB';
// Identificativo dell'unico account autorizzato: la sicurezza effettiva è garantita dalle policy RLS.
const ADMIN_UID = 'cd863dcf-14e7-4825-b808-2dd19b3f3f1c';
const brands = {1:'CERATIZIT',2:'FRAISA',3:'HORN',4:'ISCAR',5:'Kennametal',6:'Mitsubishi Materials',7:'OSG',8:'Sandvik Coromant',9:'Seco Tools',10:'Sumitomo Electric Hardmetal',11:'TaeguTec',12:'Tungaloy',13:'Walter'};
const $ = id => document.getElementById(id);
let accessToken = null, refreshToken = null, currentUser = null, allNews = [], currentFilter = 'pending';
function msg(id, text, kind=''){const el=$(id);el.textContent=text;el.className='message '+kind;}
function node(tag, cls, value){const el=document.createElement(tag);if(cls)el.className=cls;if(value!==undefined&&value!==null)el.textContent=String(value);return el;}
async function api(path, {method='GET', body, token=accessToken}={}){
 const headers={'apikey':PUBLIC_KEY};if(token)headers.Authorization='Bearer '+token;if(body!==undefined)headers['Content-Type']='application/json';
 const response=await fetch(SUPABASE_URL+path,{method,headers,body:body===undefined?undefined:JSON.stringify(body),cache:'no-store'});
 const text=await response.text();let data=null;try{data=text?JSON.parse(text):null}catch{data=text}
 if(!response.ok){throw new Error((data&&typeof data==='object'&&(data.msg||data.message||data.error_description||data.error))||`HTTP ${response.status}`)}return data;
}
async function validateUser(){const u=await api('/auth/v1/user');if(!u||u.id!==ADMIN_UID)throw new Error('Questo account non è autorizzato ad amministrare YouTool.');currentUser=u;}
function showLogin(){accessToken=null;refreshToken=null;currentUser=null;allNews=[];$('dashboard').classList.add('hidden');$('login').classList.remove('hidden');$('password').value='';}
async function signIn(email,password){const data=await api('/auth/v1/token?grant_type=password',{method:'POST',body:{email,password},token:null});accessToken=data.access_token;refreshToken=data.refresh_token;await validateUser();}
async function signOut(){const token=accessToken;showLogin();msg('login-message','Sessione terminata.');if(token){try{await api('/auth/v1/logout',{method:'POST',token})}catch(e){console.warn('Logout remoto non riuscito:',e)}}}
async function renewSession(){if(!refreshToken)throw new Error('Sessione scaduta: accedi nuovamente.');const data=await api('/auth/v1/token?grant_type=refresh_token',{method:'POST',body:{refresh_token:refreshToken},token:null});accessToken=data.access_token;refreshToken=data.refresh_token;await validateUser();}
async function withSession(fn){try{return await fn()}catch(e){if(/jwt expired|invalid jwt|token has expired/i.test(e.message)&&refreshToken){await renewSession();return await fn()}throw e}}
function isApproved(n){return n.editorial_status==='APPROVATA'&&n.published_in_feed===true}
function matches(n){if(currentFilter==='approved')return isApproved(n);if(currentFilter==='rejected')return n.editorial_status==='RIFIUTATA';if(currentFilter==='pending')return !isApproved(n)&&n.editorial_status!=='RIFIUTATA';return true}
function safeLink(url){try{const u=new URL(url);return ['http:','https:'].includes(u.protocol)?u.href:null}catch{return null}}
function render(){const root=$('items');root.replaceChildren();const visible=allNews.filter(matches);if(!visible.length){root.append(node('p','message','Nessuna notizia in questa sezione.'));return}
 for(const n of visible){const card=node('article','item');card.append(node('div','brand',brands[n.brand_id]||`Produttore ${n.brand_id}`));card.append(node('h3','',n.product_name||'Novità prodotto'));
 card.append(node('span','status',n.editorial_status||'SENZA STATO'));card.append(node('p','meta',n.tool_category||''));if(n.technical_summary)card.append(node('p','summary',n.technical_summary));
 const url=safeLink(n.source_url);if(url){const a=node('a','','Fonte ufficiale ↗');a.href=url;a.target='_blank';a.rel='noopener noreferrer';card.append(a)}
 const buttons=node('div','buttons');if(!isApproved(n))buttons.append(actionButton('Approva','approve',n,'approve'));
 if(n.editorial_status!=='RIFIUTATA')buttons.append(actionButton('Rifiuta','reject',n,'reject'));
 if(isApproved(n))buttons.append(actionButton('Revoca pubblicazione','neutral',n,'revoke'));
 card.append(buttons);root.append(card)}
}
function actionButton(label,cls,item,action){const b=node('button',cls,label);b.type='button';b.addEventListener('click',()=>changeStatus(item,action,b));return b}
async function changeStatus(item,action,button){const states={approve:{editorial_status:'APPROVATA',published_in_feed:true},reject:{editorial_status:'RIFIUTATA',published_in_feed:false},revoke:{editorial_status:'BASELINE',published_in_feed:false}};
 const state=states[action];if(!state)return;const question={approve:'Approvare e pubblicare',reject:'Rifiutare',revoke:'Revocare la pubblicazione di'}[action];if(!confirm(`${question} “${item.product_name||'questa notizia'}”?`))return;
 button.disabled=true;msg('dashboard-message','Salvataggio in corso...');
 try{await withSession(()=>api('/rest/v1/news?id=eq.'+encodeURIComponent(item.id),{method:'PATCH',body:state}));await loadNews();msg('dashboard-message','Modifica salvata. Verifica il risultato sul sito pubblico.','success')}
 catch(e){msg('dashboard-message','Errore: '+e.message,'error');button.disabled=false}
}
async function loadNews(){msg('dashboard-message','Caricamento notizie...');const query='/rest/v1/news?select=id,brand_id,product_name,tool_category,technical_summary,source_url,editorial_status,published_in_feed,created_at&order=created_at.desc&limit=500';allNews=await withSession(()=>api(query));render();msg('dashboard-message',`${allNews.length} notizie caricate.`)}
async function enterDashboard(){await validateUser();$('login').classList.add('hidden');$('dashboard').classList.remove('hidden');$('user-label').textContent=currentUser.email||'Amministratore';await loadNews()}
$('login-form').addEventListener('submit',async e=>{e.preventDefault();const b=$('login-button');b.disabled=true;msg('login-message','Accesso in corso...');try{await signIn($('email').value.trim(),$('password').value);await enterDashboard();$('password').value='';msg('login-message','')}catch(err){showLogin();msg('login-message','Accesso non riuscito: '+err.message,'error')}finally{b.disabled=false}});
$('logout-button').addEventListener('click',signOut);
$('refresh-button').addEventListener('click',async()=>{try{await loadNews()}catch(e){msg('dashboard-message','Errore: '+e.message,'error')}});
document.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',()=>{currentFilter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));render()}));
</script>
</body>
</html>
